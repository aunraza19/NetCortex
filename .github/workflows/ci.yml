name: CI

on:
  push:
    branches: [main, "b/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install every workspace package
        run: uv sync --all-packages --locked
      - name: Ruff
        run: uv run --locked ruff check . .github/scripts .github/tests
      - name: Pytest
        run: |
          uv run --locked pytest -m "not live" \
            --cov --cov-report=term-missing
