[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "netcortex-simgen"
version = "0.1.0"
description = "Deterministic network telemetry simulation and fixture tools for NetCortex"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.1", "pandas>=2.2", "pyarrow>=18", "PyYAML>=6", "httpx>=0.27", "psycopg[binary]>=3.2"]

[project.scripts]
simgen = "netcortex_simgen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/netcortex_simgen"]

[tool.hatch.build.targets.wheel.force-include]
"src/netcortex_simgen/resources/sites.yaml" = "netcortex_simgen/resources/sites.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
