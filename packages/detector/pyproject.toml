[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netcortex-detector"
version = "0.1.0"
description = "Past-only TabPFN network metric detector"
requires-python = ">=3.12"
dependencies = ["netcortex-core", "numpy>=2.0", "pandas>=2.2", "pyarrow>=18"]

[project.optional-dependencies]
cloud = ["tabpfn-client>=0.6.1", "tabpfn>=9.2.0", "tabpfn-extensions>=0.6.3", "torch>=2.14.1"]
local = ["tabpfn>=9.2.0", "tabpfn-extensions>=0.6.3", "torch>=2.14.1"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
netcortex-detector = "netcortex_detector.cli:main"
netcortex-detector-worker = "netcortex_detector.runtime:main"

[tool.hatch.build.targets.wheel]
packages = ["src/netcortex_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
