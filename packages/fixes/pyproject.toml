[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "netcortex-fixes"
version = "0.1.0"
description = "RouterOS fix templates: validate params, render commands, dry-run on CHR"
requires-python = ">=3.12,<3.13"
dependencies = ["netcortex-core", "jinja2>=3.1,<4", "pyyaml>=6,<7"]

[tool.uv.sources]
netcortex-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/netcortex_fixes"]
