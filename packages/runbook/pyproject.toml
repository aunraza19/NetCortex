[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "netcortex-runbook"
version = "0.1.0"
description = "Official RouterOS documentation retrieval for NetCortex"
requires-python = ">=3.12,<3.13"
dependencies = ["beautifulsoup4>=4.12,<5", "httpx>=0.27,<1", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
runbook = "netcortex_runbook.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/netcortex_runbook"]
