[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "netcortex-api"
version = "0.1.0"
description = "FastAPI REST + SSE for the NetCortex dashboard"
requires-python = ">=3.12,<3.13"
dependencies = [
    "netcortex-core",
    "netcortex-agent",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "temporalio>=1.18,<2",
    "pydantic-ai-slim[temporal]>=1.0,<2",
    "sentry-sdk[fastapi]>=2.40,<3",
]

[project.scripts]
api = "netcortex_api.main:serve"

[tool.uv.sources]
netcortex-core = { workspace = true }
netcortex-agent = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/netcortex_api"]
