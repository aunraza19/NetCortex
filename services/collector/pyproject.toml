[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "netcortex-collector"
version = "0.1.0"
description = "Live NetCortex collector: pings, DNS lookups and router stats for the home-lab site"
requires-python = ">=3.12,<3.13"
dependencies = [
    "netcortex-core",
    "icmplib>=3.0.4,<4",
    "dnspython>=2.6,<3",
    "httpx>=0.27,<1",
]

[project.scripts]
collector = "netcortex_collector.main:main"

[tool.uv.sources]
netcortex-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/netcortex_collector"]
